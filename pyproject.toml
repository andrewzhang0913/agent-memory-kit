[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-kit"
version = "0.1.0"
description = "A local-first, layered memory kit for AI agents: resilient tiered LLM client, multi-agent identity/scope model, append-only black-box journal, and a freshness sentinel."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["ai", "agents", "memory", "llm", "multi-agent", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
# The core is intentionally stdlib-only (urllib, json, pathlib). No required deps.
dependencies = []

[project.optional-dependencies]
# Reference adapter that talks to an external Hermes + LanceDB vector store.
hermes = []
sqlite-vec = ["sqlite-vec>=0.1.0"]
# Development / test tooling.
dev = ["pytest>=7"]

[project.scripts]
agent-memory-journal = "agent_memory.journal:main"
agent-memory-freshness = "agent_memory.freshness:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
